<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LParty</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root {
  --bg:             oklch(0.08  0     0  );
  --surface:        oklch(0.145 0.008 160);
  --surface-raised: oklch(0.19  0.010 160);
  --line:           oklch(0.27  0.008 160);  /* separators: decorative, no contrast floor */
  --line-control:   oklch(0.52  0.010 160);  /* control boundaries: 3:1 min, WCAG 1.4.11 */
  --ink:            oklch(0.97  0     0  );
  --ink-muted:      oklch(0.74  0.012 160);
  --accent:         oklch(0.72  0.140 162);
  --accent-ink:     oklch(0.16  0.040 162);
  --danger:         oklch(0.68  0.185 25 );
  --warn:           oklch(0.80  0.140 75 );

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;

  --fs-xs: 0.8125rem; --fs-sm: 0.875rem; --fs-base: 1rem;
  --fs-lg: 1.1875rem; --fs-xl: 1.5rem;   --fs-code: 1.75rem;

  --r-field: 10px; --r-card: 12px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --z-sticky: 10; --z-toast: 40;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: var(--fs-base)/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}

:where(a):focus-visible, :where(button, input, select, summary):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------------------------------------------------------------- modes */
#lobby, #room { display: none; }
body[data-mode="lobby"] #lobby { display: block; animation: fade 200ms var(--ease); }
body[data-mode="room"]  #room  { display: flex; animation: fade 200ms var(--ease); }
body[data-mode="room"]  { overflow: hidden; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* ---------------------------------------------------------------- lobby */
#lobby > header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  max-width: 940px; margin: 0 auto; padding: 32px 24px 8px;
}
.mark { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; }
.mark span { color: var(--ink-muted); font-size: var(--fs-sm); font-weight: 400; margin-left: 10px; }
/* Language codes rather than a dropdown: one click to switch, and the inactive ones
   stay lowercase and muted so the row never competes with the content. */
#lang { margin-left: auto; display: flex; gap: 2px; }
#lang button {
  background: none; border-color: transparent; color: var(--ink-muted);
  font-size: var(--fs-sm); font-weight: 500; padding: 5px 8px; border-radius: 6px;
  text-transform: lowercase; letter-spacing: 0.05em;
  transition: color 160ms var(--ease), background 160ms var(--ease);
}
#lang button:hover { color: var(--ink); background: var(--surface); }
#lang button[aria-pressed="true"] {
  color: var(--accent); font-weight: 600; text-transform: uppercase;
  text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px;
}

#lobby > main {
  max-width: 940px; margin: 0 auto; padding: 16px 24px 64px;
  display: grid; gap: 40px;
}

h1 { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.015em; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; margin: 0; }

.join-form { display: flex; gap: 8px; flex-wrap: wrap; }
#join-code {
  flex: 2 1 200px; font: 600 var(--fs-lg)/1 var(--font-mono);
  letter-spacing: 0.16em; text-transform: uppercase;
}
#join-pwd { flex: 1 1 150px; }

input, button, select { font: inherit; }
input {
  background: var(--surface-raised); color: var(--ink);
  border: 1px solid var(--line-control); border-radius: var(--r-field);
  padding: 12px 14px; min-width: 0;
  transition: border-color 160ms var(--ease), background 160ms var(--ease);
}
input::placeholder { color: var(--ink-muted); opacity: 1; letter-spacing: normal; text-transform: none; font-weight: 400; }
input:hover { border-color: var(--ink-muted); }
input:focus { border-color: var(--accent); }

button {
  background: var(--surface-raised); color: var(--ink);
  border: 1px solid var(--line-control); border-radius: var(--r-field);
  padding: 12px 18px; cursor: pointer;
  transition: background 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
}
button:hover { background: var(--surface); border-color: var(--ink-muted); }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: default; transform: none; }
button.primary {
  background: var(--accent); color: var(--accent-ink);
  border-color: transparent; font-weight: 600; padding-inline: 26px;
}
button.primary:hover { background: oklch(0.78 0.14 162); }
button.icon { padding: 12px; line-height: 0; flex: none; color: var(--ink-muted); }
button.icon:hover { color: var(--ink); }
button.ghost { background: none; border-color: transparent; color: var(--ink-muted); padding: 8px 12px; }
button.ghost:hover { background: var(--surface); color: var(--ink); border-color: transparent; }

.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.section-head button { margin-left: auto; }

.rooms { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.room {
  display: flex; gap: 12px; align-items: stretch; text-align: left; width: 100%;
  padding: 10px; background: var(--surface); border: 1px solid var(--line-control);
  border-radius: var(--r-card); color: inherit;
}
.room:hover { background: var(--surface-raised); border-color: var(--accent); }
.room img {
  width: 48px; height: 72px; flex: none; object-fit: cover;
  border-radius: 6px; background: var(--surface-raised);
}
.room .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; justify-content: center; }
.room .title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.room .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room .sub { font-size: var(--fs-xs); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room svg { flex: none; color: var(--ink-muted); }

.skeleton { height: 94px; border-radius: var(--r-card); background: var(--surface); animation: pulse 1.4s ease-in-out infinite; }
.skeleton:nth-child(2) { animation-delay: 0.15s }
.skeleton:nth-child(3) { animation-delay: 0.3s }
@keyframes pulse { 0%, 100% { opacity: 0.5 } 50% { opacity: 1 } }

.empty { padding: 8px 0 }
.empty p { margin: 0 }
.empty .t { font-weight: 600 }
.empty .h { color: var(--ink-muted); font-size: var(--fs-sm); max-width: 62ch; margin-top: 6px; text-wrap: pretty; }

.fold { border-top: 1px solid var(--line); padding-top: 20px; }
.fold summary {
  cursor: pointer; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em;
  list-style: none; display: flex; align-items: center; gap: 10px; color: var(--ink-muted);
  transition: color 160ms var(--ease);
}
.fold summary:hover, .fold[open] summary { color: var(--ink); }
.fold summary::-webkit-details-marker { display: none }
.fold summary::before {
  content: ""; width: 7px; height: 7px; flex: none;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transition: transform 160ms var(--ease);
}
.fold[open] summary::before { transform: rotate(45deg); }
.fold .body { display: grid; gap: 10px; padding-top: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > input { flex: 1 1 160px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink-muted); font-size: var(--fs-sm); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; padding: 0; }
.note { color: var(--ink-muted); font-size: var(--fs-xs); max-width: 70ch; margin: 4px 0 0; text-wrap: pretty; }

/* ---------------------------------------------------------------- room */
#room { flex-direction: column; height: 100dvh; }
.bar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink-muted); }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--ink-muted); flex: none; }
.status[data-state="online"]  .dot { background: var(--accent); }
.status[data-state="offline"] .dot { background: var(--danger); }
.status[data-state="connecting"] .dot { background: var(--warn); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

#room-code { font: 600 var(--fs-code)/1 var(--font-mono); letter-spacing: 0.12em; }
#room-name { color: var(--ink-muted); font-size: var(--fs-sm); }
#room-viewers { font-size: var(--fs-sm); color: var(--ink-muted); }
.pill {
  font-size: var(--fs-xs); padding: 3px 10px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}
#leave { margin-left: auto; padding: 8px 16px; }

#host-tools { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
#host-tools input { flex: 1; }
.stage { flex: 1; min-height: 0; background: var(--bg); }
video { display: block; width: 100%; height: 100%; background: var(--bg); }

/* ---------------------------------------------------------------- toasts */
#toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: var(--z-toast);
  display: grid; gap: 8px; max-width: min(400px, calc(100vw - 32px));
}
.toast {
  background: var(--surface-raised); border: 1px solid var(--line);
  border-radius: var(--r-field); padding: 11px 14px; font-size: var(--fs-sm);
  animation: rise 200ms var(--ease);
}
.toast.bad { border-color: var(--danger); }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

[hidden] { display: none !important; }

@media (max-width: 560px) {
  #lobby > header, #lobby > main { padding-inline: 16px; }
  #room-code { font-size: var(--fs-lg); }
  #leave { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body data-mode="lobby">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lock" viewBox="0 0 16 16">
    <path fill="none" stroke="currentColor" stroke-width="1.4" d="M4.5 7V4.75a3.5 3.5 0 0 1 7 0V7M3.5 7h9v6.5h-9z"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97M13 1.7V5h-3.3"/>
  </symbol>
</svg>

<div id="lobby">
  <header>
    <div class="mark">LParty<span data-i18n="tagline"></span></div>
    <div id="lang" role="group" data-i18n-label="lang_label"></div>
  </header>

  <main>
    <section>
      <h1 data-i18n="join_heading"></h1>
      <form class="join-form" id="join-form">
        <input id="join-code" data-i18n-ph="code_ph" maxlength="6" autocomplete="off" spellcheck="false">
        <input id="join-pwd" type="password" data-i18n-ph="pwd_ph" autocomplete="off">
        <button class="primary" data-i18n="join_btn"></button>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2 data-i18n="rooms_heading"></h2>
        <button id="refresh" class="ghost" data-i18n="refresh_btn"></button>
      </div>
      <div class="rooms" id="rooms"></div>
      <div class="empty" id="rooms-empty" hidden>
        <p class="t" data-i18n="empty_title"></p>
        <p class="h" data-i18n="empty_hint"></p>
      </div>
    </section>

    <details class="fold">
      <summary data-i18n="create_heading"></summary>
      <form class="body" id="create-form">
        <input id="create-url" data-i18n-ph="url_ph">
        <div class="row">
          <input id="create-title" data-i18n-ph="title_ph">
          <input id="create-pwd" type="password" data-i18n-ph="pwd_ph" autocomplete="off">
          <button data-i18n="create_btn"></button>
        </div>
      </form>
    </details>

    <details class="fold">
      <summary data-i18n="settings_heading"></summary>
      <div class="body">
        <div class="row">
          <input id="cfg-name" data-i18n-ph="name_ph" autocomplete="off">
          <button type="button" id="cfg-name-new" class="icon" data-i18n-label="regenerate_name">
            <svg width="17" height="17" aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
          <input id="cfg-relay" data-i18n-label="relay_label">
        </div>
        <label class="check"><input type="checkbox" id="cfg-publish"><span data-i18n="publish_label"></span></label>
        <p class="note" data-i18n="note"></p>
      </div>
    </details>
  </main>
</div>

<div id="room">
  <div class="bar">
    <span class="status" id="status" data-state="connecting">
      <i class="dot"></i><span id="status-text"></span>
    </span>
    <code id="room-code"></code>
    <span id="room-name"></span>
    <span id="room-viewers"></span>
    <span class="pill" id="room-host" data-i18n="host_badge" hidden></span>
    <button id="leave" data-i18n="leave_btn"></button>
  </div>
  <form id="host-tools" hidden>
    <input id="new-url" data-i18n-ph="switch_ph">
    <button data-i18n="switch_btn"></button>
  </form>
  <div class="stage"><video id="video" controls playsinline></video></div>
</div>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
  // A classic script, not a module: when the page is opened as file:// the browser
  // blocks module imports over CORS and the page stays silently dead — the buttons are
  // there but nothing is behind them. Strings are inlined here because i18n.js has not
  // loaded either at this point.
  addEventListener('load', () => setTimeout(() => {
    if (window.party) return;
    const lang = (navigator.languages || []).some(l => String(l).toLowerCase().startsWith('en')) ? 'en' : 'uk';
    const msg = {
      uk: { file: 'Сторінку відкрито як файл (file://) — браузер блокує завантаження модулів. Роздайте каталог по http, наприклад: python -m http.server 8777',
            other: 'Скрипт не завантажився — дивіться консоль браузера' },
      en: { file: 'This page was opened as a file (file://) — the browser blocks module loading. Serve the folder over http, e.g. python -m http.server 8777',
            other: 'The script failed to load — check the browser console' },
    }[lang];
    const el = document.createElement('div');
    el.className = 'toast bad';
    el.textContent = location.protocol === 'file:' ? msg.file : msg.other;
    document.getElementById('toasts').append(el);
  }, 1500));
</script>

<script type="module">
import { Party, DEFAULT_RELAY } from './lparty-web.js';
import { LANGS, initLang, getLang, setLang, onLangChange, t, applyTranslations } from './i18n.js';
import { randomAlias } from './names.js';

const $ = (id) => document.getElementById(id);
const video = $('video');
const params = new URLSearchParams(location.search);

// ---------------------------------------------------------------- settings
const cfg = {
  // Generated on first use and kept, so the name stays the same from one room to the
  // next and the settings field is never empty.
  get name() {
    let v = localStorage.getItem('lparty_display_name');
    if (!v) { v = randomAlias(); localStorage.setItem('lparty_display_name', v); }
    return v;
  },
  set name(v)   { localStorage.setItem('lparty_display_name', v); },
  get relay()   { return localStorage.getItem('lparty_relay') || DEFAULT_RELAY; },
  set relay(v)  { localStorage.setItem('lparty_relay', v); },
  get publish() { return localStorage.getItem('lparty_publish') !== '0'; },
  set publish(v){ localStorage.setItem('lparty_publish', v ? '1' : '0'); },
};

// ---------------------------------------------------------------- language
initLang();

function renderLangs() {
  $('lang').replaceChildren(...LANGS.map(({ code, name }) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = code;
    b.title = name;
    b.setAttribute('aria-label', name); // endonym, deliberately never translated
    b.setAttribute('aria-pressed', String(code === getLang()));
    b.onclick = () => setLang(code);
    return b;
  }));
}
renderLangs();

onLangChange(() => {
  renderLangs();
  applyTranslations();
  $('cfg-relay').placeholder = DEFAULT_RELAY;
  renderRooms(lastRooms);
  renderRoom(lastRoom);
  renderStatus();
});

// ---------------------------------------------------------------- toasts
function toast(msg, bad) {
  // Errors name a cause worth reading twice; notices are just chatter.
  const life = bad ? 14000 : 5000;
  const text = typeof msg === 'string' ? msg : t(msg.key, { ...msg, name: msg.name || t('someone') });

  // A blocked autoplay or a dead stream reports itself on every retry. Stacking four
  // identical lines says nothing the first one did not — refresh it instead.
  const shown = [...$('toasts').children].find((el) => el.textContent === text);
  if (shown) {
    clearTimeout(shown._timer);
    shown._timer = setTimeout(() => shown.remove(), life);
    return;
  }

  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = text;
  $('toasts').append(el);
  el._timer = setTimeout(() => el.remove(), life);
}

// ---------------------------------------------------------------- stream
let hls = null;
let streamUrl = null;
let triedHls = false;

const hlsAvailable = () => !!(window.Hls && Hls.isSupported());

function loadStream(url) {
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src');
  streamUrl = url;
  triedHls = false;

  if (location.protocol === 'https:' && url.startsWith('http://')) return toast({ key: 'mixed_content' }, true);

  // hls.js is tried before canPlayType, not after it. Chrome answers "maybe" to
  // canPlayType for the HLS mime types and then fails the load with
  // MEDIA_ERR_SRC_NOT_SUPPORTED, so that answer cannot be trusted to pick the path.
  // Native playback is the fallback for Safari, where hls.js is unsupported and the
  // element really does handle HLS.
  if (/\.m3u8(\?|$)/i.test(url) && hlsAvailable()) attachHls(url);
  else video.src = url;
}

function attachHls(url) {
  triedHls = true;
  hls = new Hls();
  hls.on(Hls.Events.ERROR, (_, d) => {
    if (!d.fatal) return;
    // A network error on the manifest almost always means a missing CORS header:
    // the request goes out, but the browser refuses to hand us the response.
    if (d.type === Hls.ErrorTypes.NETWORK_ERROR) toast({ key: 'cors_error' }, true);
    else toast({ key: 'playback_error', details: d.details }, true);
  });
  hls.loadSource(url);
  hls.attachMedia(video);
}

video.addEventListener('error', () => {
  const code = video.error && video.error.code;

  // Plenty of streams are HLS without saying so in the URL. The element rejects those with
  // SRC_NOT_SUPPORTED while hls.js plays them fine, so that verdict is worth a second try.
  if (code === 4 && !triedHls && streamUrl && hlsAvailable()) {
    video.removeAttribute('src');
    attachHls(streamUrl);
    return;
  }

  if (video.src || triedHls) toast({ key: 'media_error' }, true);
});

// ---------------------------------------------------------------- participant
const party = new Party({
  video, relay: cfg.relay, name: cfg.name, publish: cfg.publish,
  onEvent: (type, data) => {
    if (type === 'notice') toast(data);
    else if (type === 'error') toast(data, true);
    else if (type === 'stream') loadStream(data.url);
    else if (type === 'members') { lastViewers = data; renderViewers(); }
    else if (type === 'room') renderRoom(data);
    else if (type === 'left') { renderRoom(null); refreshLobby(); }
  },
});
window.party = party; // party.debug() from the console when chasing incompatibilities

$('cfg-name').value = cfg.name;
$('cfg-relay').value = cfg.relay;
$('cfg-publish').checked = cfg.publish;
$('cfg-name').onchange = (e) => {
  // Clearing the field hands back a fresh name rather than an empty one.
  const v = e.target.value.trim() || randomAlias();
  cfg.name = v;
  e.target.value = v;
  party.name = v;
};
$('cfg-name-new').onclick = () => {
  cfg.name = randomAlias();
  $('cfg-name').value = cfg.name;
  party.name = cfg.name;
};
$('cfg-relay').onchange   = (e) => { cfg.relay = e.target.value.trim(); party.setRelay(cfg.relay); };
$('cfg-publish').onchange = (e) => { cfg.publish = e.target.checked; party.publish = e.target.checked; };

// ---------------------------------------------------------------- room rendering
let lastRoom = null, lastViewers = 0, lastRooms = [];

function renderRoom(info) {
  lastRoom = info;
  document.body.dataset.mode = info ? 'room' : 'lobby';
  if (!info) { clearInterval(statusTimer); statusTimer = null; return; }

  $('room-code').textContent = info.id;
  $('room-name').textContent = info.name || '';
  $('room-host').hidden = !info.iAmHost;
  $('host-tools').hidden = !info.iAmHost;
  renderViewers();
  if (!statusTimer) statusTimer = setInterval(renderStatus, 1000);
  renderStatus();
}

function renderViewers() {
  $('room-viewers').textContent = lastViewers ? t('viewers', { n: lastViewers }) : '';
}

// The socket state raises no events, so poll it once a second while we are in a
// room. Cheaper than building a separate event stream for one indicator.
let statusTimer = null;
function renderStatus() {
  if (!lastRoom) return;
  const ws = party.debug().ws;
  const state = ws === 'OPEN' ? 'online' : ws === 'CONNECTING' ? 'connecting' : 'offline';
  $('status').dataset.state = state;
  $('status-text').textContent = t('status_' + state);
}

// ---------------------------------------------------------------- lobby
function renderRooms(rooms) {
  lastRooms = rooms;
  $('rooms-empty').hidden = rooms.length > 0;

  $('rooms').replaceChildren(...rooms.map((r) => {
    const btn = document.createElement('button');
    btn.className = 'room';

    // Advertisements come from strangers over a public relay, so build the card with
    // textContent and properties only — never innerHTML.
    const img = document.createElement('img');
    img.alt = '';
    if (/^https?:\/\//i.test(r.poster || '')) img.src = r.poster;

    const title = document.createElement('div');
    title.className = 'title';
    if (r.pwd) {
      const lock = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      lock.setAttribute('width', '13'); lock.setAttribute('height', '13');
      const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      use.setAttribute('href', '#i-lock');
      lock.append(use);
      title.append(lock);
    }
    const name = document.createElement('span');
    name.textContent = r.name || r.id;
    title.append(name);

    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = [r.title, r.owner, t('viewers', { n: r.members || 0 })].filter(Boolean).join(' · ');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.append(title, sub);
    btn.append(img, meta);

    btn.onclick = async () => {
      const pwd = r.pwd ? prompt(t('password_prompt', { name: r.name || r.id })) : '';
      if (pwd === null) return;
      toast({ key: 'connecting' });
      await party.join(r.id, pwd, r.name);
    };
    return btn;
  }));
}

async function refreshLobby() {
  if ($('refresh').disabled) return;
  $('refresh').disabled = true;
  $('rooms-empty').hidden = true;
  $('rooms').replaceChildren(...Array.from({ length: 3 }, () => {
    const s = document.createElement('div');
    s.className = 'skeleton';
    return s;
  }));

  const rooms = await party.browse();
  $('refresh').disabled = false;
  renderRooms(rooms);
}

// ---------------------------------------------------------------- actions
$('join-form').onsubmit = async (e) => {
  e.preventDefault();
  const code = $('join-code').value.trim();
  if (!code) return toast({ key: 'need_code' }, true);
  toast({ key: 'connecting' });
  await party.join(code, $('join-pwd').value, code);
};

$('create-form').onsubmit = async (e) => {
  e.preventDefault();
  const url = $('create-url').value.trim();
  if (!url) return toast({ key: 'need_url' }, true);
  const title = $('create-title').value.trim();
  await party.create({ url, title, name: title, password: $('create-pwd').value });
};

$('host-tools').onsubmit = (e) => {
  e.preventDefault();
  const url = $('new-url').value.trim();
  if (!url) return toast({ key: 'need_url' }, true);
  party.setStream(url, url);
  $('new-url').value = '';
};

$('leave').onclick = () => party.leave(true);
$('refresh').onclick = refreshLobby;

// A ?room=ABC123&pwd=... link only fills the form: joining must happen on a click,
// otherwise the browser blocks play() as autoplay without a user gesture.
// ?room= holds either a plain code or base64("CODE:password"), the same payload
// the Lampa plugin appends to the stream URL.
if (params.get('room')) {
  let code = params.get('room'), pwd = params.get('pwd') || '';
  try {
    const dec = decodeURIComponent(escape(atob(code)));
    const i = dec.indexOf(':');
    if (i > 0 && /^[A-Z2-9]{4,12}$/.test(dec.slice(0, i))) { code = dec.slice(0, i); pwd = dec.slice(i + 1); }
  } catch (e) { /* not base64 - keep the plain code */ }
  $('join-code').value = code;
  $('join-pwd').value = pwd;
}
if (params.get('relay')) { cfg.relay = params.get('relay'); $('cfg-relay').value = cfg.relay; party.setRelay(cfg.relay); }

addEventListener('beforeunload', () => party.leave(true));

applyTranslations();
$('cfg-relay').placeholder = DEFAULT_RELAY;
refreshLobby();
</script>
</body>
</html>
